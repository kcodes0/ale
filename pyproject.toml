[project]
name = "ale"
version = "0.1.0"
description = "Ale, a Discord-native day-to-day extensible Claude Agent SDK harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.70",
    "discord.py>=2.6.0",
    "fpdf2>=2.7.0",
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
ale = "ale.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
